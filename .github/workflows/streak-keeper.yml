name: Keep my Duolingo streak

on:
  # Fires well before the target window; the first job step then sleeps
  # until a random moment between 22:00 and 23:00 Israel time, which is
  # UTC+3 in summer and UTC+2 in winter.
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
    inputs: {}

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait until a random time between 22:00 and 23:00 Israel time
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Jerusalem date -d "22:00" +%s)
          sleep_for=$(( target + RANDOM % 3600 - $(date +%s) ))
          if [ "$sleep_for" -gt 0 ]; then
            echo "Sleeping ${sleep_for}s until $(TZ=Asia/Jerusalem date -d "@$(( $(date +%s) + sleep_for ))")"
            sleep "$sleep_for"
          fi
      - name: Study (up to 3 attempts, 10 minutes apart)
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
          LESSONS: 5
        run: |
          for attempt in 1 2 3; do
            node index.js && exit 0
            echo "::warning::Attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 600
          done
          exit 1
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep scheduled workflow enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/streak-keeper.yml/enable"
      - name: Delete old workflow runs (keep 10 newest, 30 days)
        run: |
          cutoff=$(date -u -d '30 days ago' +%s)
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate \
            -q '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' |
          tail -n +11 |
          while IFS=$'\t' read -r id created_at; do
            if [ "$(date -u -d "$created_at" +%s)" -lt "$cutoff" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
            fi
          done
